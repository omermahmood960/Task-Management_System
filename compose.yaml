services:
  db-service:
    image: postgres:16
    environment:
      POSTGRES_DB: TMS
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: abdulbar
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5